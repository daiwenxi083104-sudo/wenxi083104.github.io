            direction: 'asc' // 'asc' 或 'desc'
        };

        // 辅助函数：获取相对日期的 YYYY-MM-DD 字符串
        function getFutureDate(daysOffset) {
            const d = new Date();
            d.setDate(d.getDate() + daysOffset);
            return d.toISOString().split('T')[0];
        }

        // 保存 tasks 到 localStorage
        function saveTasks() {
            localStorage.setItem('workboard_tasks', JSON.stringify(tasks));
            console.log('✅ Tasks saved to localStorage');
        }

        // 从 localStorage 读取 tasks，若无则使用默认示例
        function loadTasks() {
            const stored = localStorage.getItem('workboard_tasks');
            if (stored) {
                try {
                    tasks = JSON.parse(stored);
                    console.log('📦 Tasks loaded from localStorage');
                } catch (e) {
                    console.warn('⚠️ Failed to parse stored tasks, using defaults');
                    tasks = JSON.parse(JSON.stringify(defaultTasks));
                    saveTasks();
                }
            } else {
                tasks = JSON.parse(JSON.stringify(defaultTasks));
                saveTasks();
                console.log('🆕 No stored tasks found, initialized with defaults');
            }
            console.log('Current tasks:', tasks);
        }

        // ==================== 表格渲染 ====================

        // 表头配置
        const tableColumns = [
            { key: 'name', label: '任务名称', sortable: true },
            { key: 'category', label: '分类', sortable: true },
            { key: 'priority', label: '优先级', sortable: true },
            { key: 'urgency', label: '紧急度', sortable: true },
            { key: 'status', label: '状态', sortable: true },
            { key: 'dueDate', label: '截止日期', sortable: true },
            { key: 'completedDate', label: '实际完成日期', sortable: true },
            { key: 'blocked', label: '阻塞标记', sortable: true }
        ];

        // 获取筛选条件
        function getFilterValues() {
            const searchText = document.querySelector('#globalSearch')?.value?.toLowerCase() || '';
            const category = document.querySelector('#filterCategory')?.value || 'all';
            const status = document.querySelector('#filterStatus')?.value || 'all';
            const priority = document.querySelector('#filterPriority')?.value || 'all';
            return { searchText, category, status, priority };
        }

        // 筛选任务
        function filterTasks(taskList) {
            const { searchText, category, status, priority } = getFilterValues();
            
            return taskList.filter(task => {
                // 搜索筛选（任务名称包含搜索词，不区分大小写）
                if (searchText && !task.name.toLowerCase().includes(searchText)) {
                    return false;
                }
                // 分类精确匹配
                if (category !== 'all' && task.category !== category) {
                    return false;
                }
                // 状态精确匹配
                if (status !== 'all' && task.status !== status) {
                    return false;
                }
                // 优先级精确匹配
                if (priority !== 'all' && task.priority !== priority) {
                    return false;
                }
                return true;
            });
        }

        // 排序任务
        function sortTasks(taskList) {
            if (!sortState.column) return taskList;
            
            const sorted = [...taskList];
            const column = sortState.column;
            const dir = sortState.direction === 'asc' ? 1 : -1;
            
            sorted.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];
                
                // 处理 null 值
                if (valA === null && valB === null) return 0;
                if (valA === null) return 1 * dir;
                if (valB === null) return -1 * dir;
                
                // 日期列按时间戳排序
                if (column === 'dueDate' || column === 'completedDate') {
                    return (new Date(valA) - new Date(valB)) * dir;
                }
                
                // 阻塞标记（布尔值）
                if (column === 'blocked') {
                    return (valA === valB ? 0 : valA ? 1 : -1) * dir;
                }
                
                // 字符串按拼音/localeCompare排序
                if (typeof valA === 'string' && typeof valB === 'string') {
                    return valA.localeCompare(valB, 'zh-CN') * dir;
                }
                
                // 默认比较
                return (valA > valB ? 1 : -1) * dir;
            });
            
            return sorted;
        }

        // 渲染优先级标签
        function renderPriority(priority) {
            const labels = { high: '高', medium: '中', low: '低' };
            return `<span class="priority-badge priority-${priority}">${labels[priority] || priority}</span>`;
        }

        // 渲染状态标签
        function renderStatus(status) {
            const labels = { 
                'todo': '待开始', 
                'in-progress': '进行中', 
                'done': '已完成',
                'blocked': '阻塞暂停',
                'archived': '已归档'
            };
            return `<span class="status-badge status-${status}">${labels[status] || status}</span>`;
        }

        // 渲染紧急度标签
        function renderUrgency(urgency) {
            const labels = { urgent: '紧急', normal: '普通' };
            return `<span class="urgency-badge urgency-${urgency}">${labels[urgency] || urgency}</span>`;
        }

        // 渲染阻塞标记
        function renderBlocked(blocked) {
            return blocked 
                ? '<span class="blocked-yes">是</span>' 
                : '<span class="blocked-no">否</span>';
        }

        // 渲染日期
        function renderDate(date) {
            return date || '<span style="color:#94a3b8">-</span>';
        }

        // 主渲染函数
        function renderTable() {
            const container = document.getElementById('tableContainer');
            if (!container) return;
            
            // 筛选并排序
            let filtered = filterTasks(tasks);
            filtered = sortTasks(filtered);
            
            // 空状态
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>暂无符合条件的任务</p>
                        <p style="font-size:13px; margin-top:8px;">尝试调整筛选条件</p>
                    </div>
                `;
                return;
            }
            
            // 构建表格
            let html = '<table class="task-table"><thead><tr>';
            
            // 表头
            tableColumns.forEach(col => {
                const sortClass = sortState.column === col.key 
                    ? (sortState.direction === 'asc' ? 'sort-asc' : 'sort-desc') 
                    : '';
                html += `<th class="${sortClass}" data-column="${col.key}" ${col.sortable ? '' : ''}>
                    ${col.label}
                    <span class="sort-indicator">▲</span>
                </th>`;
            });
            html += '</tr></thead><tbody>';
            
            // 数据行
            filtered.forEach(task => {
                html += `<tr data-task-id="${task.id}">`;
                html += `<td data-field="name">${task.name}</td>`;
                html += `<td data-field="category">${task.category}</td>`;
                html += `<td data-field="priority">${renderPriority(task.priority)}</td>`;
                html += `<td data-field="urgency">${renderUrgency(task.urgency)}</td>`;
                html += `<td data-field="status">${renderStatus(task.status)}</td>`;
                html += `<td data-field="dueDate">${renderDate(task.dueDate)}</td>`;
                html += `<td data-field="completedDate">${renderDate(task.completedDate)}</td>`;
                html += `<td data-field="blocked">${renderBlocked(task.blocked)}</td>`;
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
            
            // 绑定表头点击排序
            container.querySelectorAll('th[data-column]').forEach(th => {
                th.addEventListener('click', function() {
                    const column = this.dataset.column;
                    if (sortState.column === column) {
                        // 切换方向
                        sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
                    } else {
                        // 新列，默认升序
                        sortState.column = column;
                        sortState.direction = 'asc';
                    }
                    renderTable();
                });
            });
            
            // 绑定双击编辑
            container.querySelectorAll('tbody td').forEach(td => {
                td.addEventListener('dblclick', function() {
                    startInlineEdit(this);
                });
            });

            // 绑定单击行打开详情（任务名称列）
            container.querySelectorAll('tbody td[data-field="name"]').forEach(td => {
                td.addEventListener('click', function() {
                    const taskId = this.closest('tr').dataset.taskId;
                    openTaskDetail(taskId);
                });
            });
        }

        // ==================== 内联编辑 ====================

        function startInlineEdit(cell) {
            const field = cell.dataset.field;
            const taskId = cell.closest('tr').dataset.taskId;
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            
            // 实际完成日期列不可编辑（根据需求）
            if (field === 'completedDate') return;
            
            const currentValue = task[field];
            cell.classList.add('cell-editing');
            
            let editor;
            
            // 根据字段类型创建不同的编辑器
            if (field === 'priority') {
                editor = document.createElement('select');
                editor.className = 'cell-editor-select';
                editor.innerHTML = `
                    <option value="high" ${currentValue === 'high' ? 'selected' : ''}>高</option>
                    <option value="medium" ${currentValue === 'medium' ? 'selected' : ''}>中</option>
                    <option value="low" ${currentValue === 'low' ? 'selected' : ''}>低</option>
                `;
            } else if (field === 'urgency') {
                editor = document.createElement('select');
                editor.className = 'cell-editor-select';
                editor.innerHTML = `
                    <option value="urgent" ${currentValue === 'urgent' ? 'selected' : ''}>紧急</option>
                    <option value="normal" ${currentValue === 'normal' ? 'selected' : ''}>普通</option>
                `;
            } else if (field === 'status') {
                editor = document.createElement('select');
                editor.className = 'cell-editor-select';
                editor.innerHTML = `
                    <option value="todo" ${currentValue === 'todo' ? 'selected' : ''}>待开始</option>
                    <option value="in-progress" ${currentValue === 'in-progress' ? 'selected' : ''}>进行中</option>
                    <option value="done" ${currentValue === 'done' ? 'selected' : ''}>已完成</option>
                    <option value="blocked" ${currentValue === 'blocked' ? 'selected' : ''}>阻塞暂停</option>
                    <option value="archived" ${currentValue === 'archived' ? 'selected' : ''}>已归档</option>
                `;
            } else if (field === 'blocked') {
                editor = document.createElement('select');
                editor.className = 'cell-editor-select';
                editor.innerHTML = `
                    <option value="true" ${currentValue === true ? 'selected' : ''}>是</option>
                    <option value="false" ${currentValue === false ? 'selected' : ''}>否</option>
                `;
            } else if (field === 'dueDate') {
                editor = document.createElement('input');
                editor.type = 'date';
                editor.className = 'cell-editor-date';
                editor.value = currentValue || '';
            } else if (field === 'category') {
                editor = document.createElement('select');
                editor.className = 'cell-editor-select';
                const categories = ['活动策划', '媒体运营', '视觉设计', '员工关怀'];
                editor.innerHTML = categories.map(c => 
                    `<option value="${c}" ${currentValue === c ? 'selected' : ''}>${c}</option>`
                ).join('');
            } else {
                // 默认文本输入（任务名称）
                editor = document.createElement('input');
                editor.type = 'text';
                editor.className = 'cell-editor';
                editor.value = currentValue || '';
            }
            
            // 清空单元格并放入编辑器
            cell.innerHTML = '';
            cell.appendChild(editor);
            editor.focus();
            
            // 保存编辑的函数
            function saveEdit() {
                let newValue;
                if (field === 'blocked') {
                    newValue = editor.value === 'true';
                } else if (field === 'dueDate') {
                    newValue = editor.value || null;
                } else {
                    newValue = editor.value;
                }
                
                // 更新数据
                task[field] = newValue;
                saveTasks();
                updateKPI();
                updateRisks();

                // 重新渲染
                renderTable();
            }
            
            // 失焦保存
            editor.addEventListener('blur', saveEdit);
            
            // Enter保存，Escape取消
            editor.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    saveEdit();
                } else if (e.key === 'Escape') {
                    renderTable(); // 取消编辑，重新渲染恢复原始值
                }
            });
        }

        // ==================== KPI 自动计算 ====================

        function updateKPI() {
            // 排除归档任务
            const active = tasks.filter(t => t.status !== 'archived');
            const total = active.length;

            // 已完成任务
            const doneTasks = active.filter(t => t.status === 'done');
            const doneCount = doneTasks.length;

            // 按时完成：completedDate <= dueDate
            const onTimeCount = doneTasks.filter(t => {
                if (!t.completedDate || !t.dueDate) return false;
                return t.completedDate <= t.dueDate;
            }).length;

            // 延期：未完成 且 dueDate < 今天
            const today = new Date().toISOString().split('T')[0];
            const overdueCount = active.filter(t => {
                return t.status !== 'done' && t.dueDate && t.dueDate < today;
            }).length;

            // 计算百分比
            const doneRate = total > 0 ? Math.round((doneCount / total) * 100) : 0;
            const onTimeRate = doneCount > 0 ? Math.round((onTimeCount / doneCount) * 100) : 0;
            const overdueRate = total > 0 ? Math.round((overdueCount / total) * 100) : 0;

            // 更新 DOM
            document.getElementById('kpiTotal').textContent = total;
            document.getElementById('kpiTotalBar').style.width = Math.min(total * 10, 100) + '%';

            document.getElementById('kpiDone').textContent = doneRate + '%';
            document.getElementById('kpiDoneBar').style.width = doneRate + '%';

            document.getElementById('kpiOnTime').textContent = onTimeRate + '%';
            document.getElementById('kpiOnTimeBar').style.width = onTimeRate + '%';

            document.getElementById('kpiOverdue').textContent = overdueRate + '%';
            document.getElementById('kpiOverdueBar').style.width = overdueRate + '%';
        }

        // ==================== 本月目标持久化 ====================

        function initGoal() {
            const goalInput = document.getElementById('goalInput');
            if (!goalInput) return;

            // 从 localStorage 恢复
            const saved = localStorage.getItem('workboard_goal');
            if (saved) {
                goalInput.value = saved;
            }

            // 修改后自动保存
            goalInput.addEventListener('input', debounce(function() {
                localStorage.setItem('workboard_goal', goalInput.value);
            }, 300));
        }

        // ==================== 任务详情弹窗 ====================

        let currentDetailTaskId = null;

        // 确保 task 有 detail 字段
        function ensureDetail(task) {
            if (!task.detail) {
                task.detail = { communications: [], achievements: [], changeLogs: [], doc: '' };
            }
            if (!task.detail.communications) task.detail.communications = [];
            if (!task.detail.achievements) task.detail.achievements = [];
            if (!task.detail.changeLogs) task.detail.changeLogs = [];
            if (task.detail.doc === undefined) task.detail.doc = '';
        }

        function openTaskDetail(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            currentDetailTaskId = taskId;
            ensureDetail(task);

            // 填充表单
            document.getElementById('detailName').value = task.name;
            document.getElementById('detailCategory').value = task.category;
            document.getElementById('detailPriority').value = task.priority;
            document.getElementById('detailUrgency').value = task.urgency;
            document.getElementById('detailStatus').value = task.status;
            document.getElementById('detailDueDate').value = task.dueDate || '';
            document.getElementById('detailBlocked').checked = !!task.blocked;
            document.getElementById('detailTags').value = (task.tags || []).join(', ');
            document.getElementById('detailDoc').value = task.detail.doc || '';

            // 渲染列表
            renderDetailList('commList', task.detail.communications);
            renderDetailList('achList', task.detail.achievements, true);
            renderDetailList('logList', task.detail.changeLogs);

            // 隐藏新增行
            document.getElementById('commAddRow').style.display = 'none';
            document.getElementById('achAddRow').style.display = 'none';
            document.getElementById('logAddRow').style.display = 'none';

            // 显示弹窗
            document.getElementById('taskModal').classList.add('active');
        }

        function closeTaskDetail() {
            document.getElementById('taskModal').classList.remove('active');
            currentDetailTaskId = null;
        }

        function renderDetailList(listId, items, noDate) {
            const ul = document.getElementById(listId);
            if (!items || items.length === 0) {
                ul.innerHTML = '<li class="detail-list-item" style="color:var(--text-muted);justify-content:center">暂无记录</li>';
                return;
            }
            ul.innerHTML = items.map((item, idx) => {
                const dateStr = noDate ? '' : `<span class="item-date">${item.date || ''}</span>`;
                return `<li class="detail-list-item">
                    ${dateStr}
                    <span class="item-content">${item.content || item}</span>
                    <span class="item-del" onclick="removeDetailItem('${listId}',${idx})">✕</span>
                </li>`;
            }).join('');
        }

        function removeDetailItem(listId, idx) {
            const task = tasks.find(t => t.id === currentDetailTaskId);
            if (!task) return;
            ensureDetail(task);
            let arr;
            if (listId === 'commList') arr = task.detail.communications;
            else if (listId === 'achList') arr = task.detail.achievements;
            else arr = task.detail.changeLogs;
            arr.splice(idx, 1);
            renderDetailList(listId, arr, listId === 'achList');
        }

        // 沟通记录新增
        function addCommRow() {
            const row = document.getElementById('commAddRow');
            row.style.display = row.style.display === 'none' ? 'flex' : 'none';
            if (row.style.display === 'flex') {
                document.getElementById('commDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('commContent').value = '';
                document.getElementById('commContent').focus();
            }
        }

        function confirmAddComm() {
            const content = document.getElementById('commContent').value.trim();
            if (!content) return;
            const task = tasks.find(t => t.id === currentDetailTaskId);
            if (!task) return;
            ensureDetail(task);
            task.detail.communications.push({ date: document.getElementById('commDate').value, content });
            renderDetailList('commList', task.detail.communications);
            document.getElementById('commAddRow').style.display = 'none';
        }

        // 阶段性成果新增
        function addAchRow() {
            const row = document.getElementById('achAddRow');
            row.style.display = row.style.display === 'none' ? 'flex' : 'none';
            if (row.style.display === 'flex') {
                document.getElementById('achContent').value = '';
                document.getElementById('achContent').focus();
            }
        }

        function confirmAddAch() {
            const content = document.getElementById('achContent').value.trim();
            if (!content) return;
            const task = tasks.find(t => t.id === currentDetailTaskId);
            if (!task) return;
            ensureDetail(task);
            task.detail.achievements.push(content);
            renderDetailList('achList', task.detail.achievements, true);
            document.getElementById('achAddRow').style.display = 'none';
        }

        // 变更日志新增
        function addLogRow() {
            const row = document.getElementById('logAddRow');
            row.style.display = row.style.display === 'none' ? 'flex' : 'none';
            if (row.style.display === 'flex') {
                document.getElementById('logContent').value = '';
                document.getElementById('logContent').focus();
            }
        }

        function confirmAddLog() {
            const content = document.getElementById('logContent').value.trim();
            if (!content) return;
            const task = tasks.find(t => t.id === currentDetailTaskId);
            if (!task) return;
            ensureDetail(task);
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
            task.detail.changeLogs.push({ date: timeStr, content });
            renderDetailList('logList', task.detail.changeLogs);
            document.getElementById('logAddRow').style.display = 'none';
        }

        // 保存任务详情
        function saveTaskDetail() {
            const task = tasks.find(t => t.id === currentDetailTaskId);
            if (!task) return;
            ensureDetail(task);

            const oldStatus = task.status;
            const today = new Date().toISOString().split('T')[0];

            task.name = document.getElementById('detailName').value.trim() || task.name;
            task.category = document.getElementById('detailCategory').value.trim() || task.category;
            task.priority = document.getElementById('detailPriority').value;
            task.urgency = document.getElementById('detailUrgency').value;
            task.status = document.getElementById('detailStatus').value;
            task.dueDate = document.getElementById('detailDueDate').value || null;
            task.blocked = document.getElementById('detailBlocked').checked;
            task.tags = document.getElementById('detailTags').value.split(',').map(s => s.trim()).filter(Boolean);
            task.detail.doc = document.getElementById('detailDoc').value;

            // 自动记录状态变更
            if (oldStatus !== task.status) {
                const now = new Date();
                const timeStr = now.toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
                task.detail.changeLogs.push({ date: timeStr, content: `状态从"${statusLabel(oldStatus)}"变更为"${statusLabel(task.status)}"` });
            }

            // 自动设置完成日期
            if (task.status === 'done' && !task.completedDate) {
                task.completedDate = today;
            }

            saveTasks();
            closeTaskDetail();
            refreshAll();
        }

        function statusLabel(status) {
            const map = { 'todo':'待开始', 'in-progress':'进行中', 'review':'待验收', 'done':'已完成', 'blocked':'阻塞暂停', 'delayed':'已延期', 'archived':'已归档' };
            return map[status] || status;
        }

        // 删除任务
        function deleteTask() {
            if (!currentDetailTaskId) return;
            if (!confirm('确定要删除这个任务吗？此操作不可撤销。')) return;
            tasks = tasks.filter(t => t.id !== currentDetailTaskId);
            saveTasks();
            closeTaskDetail();
            refreshAll();
        }

        // 刷新所有模块
        function refreshAll() {
            updateKPI();
            updateRisks();
            renderTable();
            renderTodo();
        }

        // 点击弹窗外部关闭
        document.getElementById('taskModal').addEventListener('click', function(e) {
            if (e.target === this) closeTaskDetail();
        });

        // ESC 关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeTaskDetail();
        });

        // ==================== 泳道看板 ====================

        let kanbanSortables = [];

        function renderKanban() {
            const container = document.getElementById('kanbanContainer');
            if (!container) return;

            // 过滤 project 类型且非归档
            let projects = tasks.filter(t => t.type === 'project' && t.status !== 'archived');

            // 按 category 分组
            const categories = [...new Set(projects.map(t => t.category))].sort();
            if (categories.length === 0) {
                container.innerHTML = '<div class="kanban-empty">暂无项目，请在台账表格中添加 type 为 "project" 的任务</div>';
                return;
            }

            // 每个分类内按 order 排序
            let html = '<div class="kanban-board">';
            categories.forEach(cat => {
                const catTasks = projects.filter(t => t.category === cat).sort((a, b) => (a.order || 0) - (b.order || 0));
                html += `
                <div class="kanban-lane" data-category="${cat}">
                    <div class="kanban-lane-header">
                        <span class="kanban-lane-title">${cat}</span>
                        <span class="kanban-lane-count">${catTasks.length}</span>
                    </div>
                    <div class="kanban-cards" data-category="${cat}">
                        ${catTasks.map(t => renderKanbanCard(t)).join('')}
                        ${catTasks.length === 0 ? '<div class="kanban-empty">拖拽任务到此处</div>' : ''}
                    </div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;

            // 绑定卡片点击打开详情
            container.querySelectorAll('.kanban-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.kanban-card')) {
                        openTaskDetail(this.dataset.taskId);
                    }
                });
            });

            // 初始化 SortableJS 拖拽
            initKanbanSortable();
        }

        function renderKanbanCard(task) {
            const today = new Date().toISOString().split('T')[0];
            const dueClass = task.dueDate
                ? (task.dueDate < today ? 'overdue' : task.dueDate === today ? 'today' : '')
                : '';
            const progress = task.progress || 0;
            return `
            <div class="kanban-card" data-task-id="${task.id}">
                <div class="kanban-card-name">${task.name}</div>
                <div class="kanban-card-meta">
                    <span class="kanban-card-due ${dueClass}">📅 ${task.dueDate || '无截止日期'}</span>
                    <span>${renderPriority(task.priority)}</span>
                </div>
                <div class="kanban-progress-wrap">
                    <div class="kanban-progress-bar">
                        <div class="kanban-progress-fill" style="width:${progress}%"></div>
                    </div>
                    <span class="kanban-progress-text">${progress}%</span>
                </div>
            </div>`;
        }

        function initKanbanSortable() {
            // 销毁旧的 sortable 实例
            kanbanSortables.forEach(s => s.destroy());
            kanbanSortables = [];

            document.querySelectorAll('.kanban-cards').forEach(el => {
                const sortable = new Sortable(el, {
                    group: 'kanban', // 允许跨泳道拖拽
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    onEnd: function(evt) {
                        const newCategory = evt.to.dataset.category;
                        const oldCategory = evt.from.dataset.category;
                        const taskId = evt.item.dataset.taskId;
                        const task = tasks.find(t => t.id === taskId);
                        if (!task) return;

                        // 更新 category
                        if (newCategory !== oldCategory) {
                            task.category = newCategory;
                        }

                        // 更新 order：按新顺序重新分配
                        const newOrderIds = [...evt.to.children]
                            .filter(child => child.classList.contains('kanban-card'))
                            .map(child => child.dataset.taskId);

                        newOrderIds.forEach((id, idx) => {
                            const t = tasks.find(x => x.id === id);
                            if (t) t.order = idx;
                        });

                        saveTasks();
                        refreshAll();
                    }
                });
                kanbanSortables.push(sortable);
            });
        }

        // ==================== 风险预警 ====================

        function updateRisks() {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            // 计算 today+1 和 today+3 的日期字符串
            const d1 = new Date(today); d1.setDate(d1.getDate() + 1);
            const d3 = new Date(today); d3.setDate(d3.getDate() + 3);
            const soonStart = d1.toISOString().split('T')[0];
            const soonEnd = d3.toISOString().split('T')[0];

            const active = tasks.filter(t => t.status !== 'archived');

            // 已超期：未完成 且 dueDate < 今天
            const overdue = active.filter(t => t.status !== 'done' && t.dueDate && t.dueDate < todayStr);

            // 即将到期：未完成 且 dueDate 在 [today+1, today+3]
            const soon = active.filter(t => t.status !== 'done' && t.dueDate && t.dueDate >= soonStart && t.dueDate <= soonEnd);

            // 阻塞卡点：blocked === true 且 未完成
            const blocked = active.filter(t => t.blocked === true && t.status !== 'done');

            // 渲染已超期
            document.getElementById('riskOverdueCount').textContent = overdue.length;
            const overdueEl = document.getElementById('riskOverdueList');
            if (overdue.length === 0) {
                overdueEl.innerHTML = '<div class="risk-item">暂无已超期的任务</div>';
            } else {
                overdueEl.innerHTML = overdue.map(t => {
                    const days = Math.ceil((today - new Date(t.dueDate)) / 86400000);
                    return `<div class="risk-item" onclick="openTaskDetail('${t.id}')">
                        <div class="risk-item-link">
                            <span class="risk-item-name">${t.name}</span>
                            <span class="risk-item-days overdue">延迟${days}天</span>
                        </div>
                    </div>`;
                }).join('');
            }

            // 渲染即将到期
            document.getElementById('riskSoonCount').textContent = soon.length;
            const soonEl = document.getElementById('riskSoonList');
            if (soon.length === 0) {
                soonEl.innerHTML = '<div class="risk-item">暂无即将到期的任务</div>';
            } else {
                soonEl.innerHTML = soon.map(t => {
                    const days = Math.ceil((new Date(t.dueDate) - today) / 86400000);
                    return `<div class="risk-item" onclick="openTaskDetail('${t.id}')">
                        <div class="risk-item-link">
                            <span class="risk-item-name">${t.name}</span>
                            <span class="risk-item-days soon">剩余${days}天</span>
                        </div>
                    </div>`;
                }).join('');
            }

            // 渲染阻塞卡点
            document.getElementById('riskBlockCount').textContent = blocked.length;
            const blockEl = document.getElementById('riskBlockList');
            if (blocked.length === 0) {
                blockEl.innerHTML = '<div class="risk-item">暂无阻塞中的任务</div>';
            } else {
                blockEl.innerHTML = blocked.map(t => {
                    const daysText = t.dueDate
                        ? (t.dueDate < todayStr
                            ? `<span class="risk-item-days overdue">延迟${Math.ceil((today - new Date(t.dueDate)) / 86400000)}天</span>`
                            : `<span class="risk-item-days soon">剩余${Math.ceil((new Date(t.dueDate) - today) / 86400000)}天</span>`)
                        : '';
                    return `<div class="risk-item" onclick="openTaskDetail('${t.id}')">
                        <div class="risk-item-link">
                            <span class="risk-item-name">${t.name}</span>
                            ${daysText}
                        </div>
                    </div>`;
                }).join('');
            }
        }

        // ==================== 待办清单 ====================

        // 待办视图状态
        let todoFilter = 'all'; // 'all' | 'in-progress' | 'done'

        // 四象限排序权重
        function quadrantWeight(task) {
            if (task.urgency === 'urgent' && task.priority === 'high') return 1;       // 紧急+重要
            if (task.priority === 'high' && task.urgency === 'normal') return 2;        // 重要不紧急
            if (task.urgency === 'urgent' && task.priority !== 'high') return 3;       // 紧急不重要
            return 4;                                                                   // 其他
        }

        // 渲染待办清单
        function renderTodo() {
            const container = document.getElementById('todoContainer');
            const statsEl = document.getElementById('todoStats');
            if (!container) return;

            const today = new Date().toISOString().split('T')[0];

            // 基础过滤：type === "task" 且 status !== "archived"
            let filtered = tasks.filter(t => t.type === 'task' && t.status !== 'archived');

            // 视图过滤
            if (todoFilter === 'in-progress') {
                filtered = filtered.filter(t => t.status === 'in-progress');
            } else if (todoFilter === 'done') {
                filtered = filtered.filter(t => t.status === 'done');
            }

            // 四象限排序 + 同象限按截止日期升序
            filtered.sort((a, b) => {
                const wA = quadrantWeight(a);
                const wB = quadrantWeight(b);
                if (wA !== wB) return wA - wB;
                // 同象限按截止日期升序，无日期排后面
                if (!a.dueDate && !b.dueDate) return 0;
                if (!a.dueDate) return 1;
                if (!b.dueDate) return -1;
                return a.dueDate.localeCompare(b.dueDate);
            });

            // 今日统计
            const todayDone = tasks.filter(t => t.completedDate === today).length;
            const todayDue = tasks.filter(t => t.dueDate === today && t.status !== 'archived').length;
            const todayRate = todayDue > 0 ? Math.round((todayDone / todayDue) * 100) : (todayDone > 0 ? 100 : 0);

            statsEl.innerHTML = `
                <span>今日完成 <span class="stat-num">${todayDone}</span> 项</span>
                <span>待办完成率 <span class="stat-num">${todayRate}%</span></span>
            `;

            // 空状态
            if (filtered.length === 0) {
                container.innerHTML = '<div class="todo-empty">暂无符合条件的待办任务</div>';
                return;
            }

            // 渲染列表
            let html = '<ul class="todo-list">';
            filtered.forEach(task => {
                const isDone = task.status === 'done';
                const dueClass = task.dueDate
                    ? (task.dueDate < today ? 'is-overdue' : task.dueDate === today ? 'is-today' : '')
                    : '';

                html += `
                <li class="todo-item ${isDone ? 'is-done' : ''}" data-task-id="${task.id}">
                    <input type="checkbox" class="todo-checkbox" ${isDone ? 'checked' : ''}>
                    <div class="todo-info">
                        <div class="todo-name" data-task-id="${task.id}">${task.name}</div>
                        <div class="todo-meta">
                            ${renderPriority(task.priority)}
                            ${renderUrgency(task.urgency)}
                            <span class="todo-tag todo-tag-category">${task.category}</span>
                        </div>
                    </div>
                    <div class="todo-due ${dueClass}">${task.dueDate || '-'}</div>
                </li>`;
            });
            html += '</ul>';
            container.innerHTML = html;

            // 绑定复选框事件
            container.querySelectorAll('.todo-checkbox').forEach(cb => {
                cb.addEventListener('change', function() {
                    const taskId = this.closest('.todo-item').dataset.taskId;
                    const task = tasks.find(t => t.id === taskId);
                    if (!task) return;

                    if (this.checked) {
                        task.status = 'done';
                        task.completedDate = today;
                    } else {
                        task.status = 'todo';
                        task.completedDate = null;
                    }
                    saveTasks();
                    updateKPI();
                    updateRisks();
                    renderTodo();
                    renderTable();
                });
            });

            // 绑定任务名称点击
            container.querySelectorAll('.todo-name').forEach(nameEl => {
                nameEl.addEventListener('click', function() {
                    openTaskDetail(this.dataset.taskId);
                });
            });
        }

        // 绑定待办筛选按钮
        function bindTodoFilters() {
            document.querySelectorAll('.todo-filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.todo-filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    todoFilter = this.dataset.todoFilter;
                    renderTodo();
                });
            });
        }

        // ==================== 筛选联动 ====================

        function bindFilters() {
            const searchInput = document.querySelector('#globalSearch');
            const filterCategory = document.querySelector('#filterCategory');
            const filterStatus = document.querySelector('#filterStatus');
            const filterPriority = document.querySelector('#filterPriority');
            
            if (searchInput) {
                searchInput.addEventListener('input', debounce(renderTable, 200));
            }
            if (filterCategory) {
                filterCategory.addEventListener('change', renderTable);
            }
            if (filterStatus) {
                filterStatus.addEventListener('change', renderTable);
            }
            if (filterPriority) {
                filterPriority.addEventListener('change', renderTable);
            }
        }

        // 防抖函数
        function debounce(fn, delay) {
            let timer = null;
            return function() {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, arguments), delay);
            };
        }

        // ==================== Tab 切换 ====================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                const tabId = this.dataset.tab;
                document.getElementById(tabId).classList.add('active');
            });
        });

        // ==================== 运营仪表盘 ====================

        function renderDashboard() {
            const container = document.getElementById('dashboardContainer');
            if (!container) return;

            const active = tasks.filter(t => t.status !== 'archived');
            const total = active.length;
            const today = new Date().toISOString().split('T')[0];

            // 按分类统计
            const categories = ['活动策划', '媒体运营', '视觉设计', '员工关怀'];
            const catColors = ['cat-1', 'cat-2', 'cat-3', 'cat-4'];
            const catCounts = categories.map(cat => active.filter(t => t.category === cat).length);
            const maxCat = Math.max(...catCounts, 1);

            // 按优先级统计
            const highCount = active.filter(t => t.priority === 'high').length;
            const medCount = active.filter(t => t.priority === 'medium').length;
            const lowCount = active.filter(t => t.priority === 'low').length;

            // 按状态统计
            const todoCount = active.filter(t => t.status === 'todo').length;
            const ipCount = active.filter(t => t.status === 'in-progress').length;
            const doneCount = active.filter(t => t.status === 'done').length;
            const blockedCount = active.filter(t => t.status === 'blocked').length;

            // 今日完成
            const todayDone = active.filter(t => t.completedDate === today).length;

            // 最近活动时间线
            const recentTasks = [...active]
                .filter(t => t.completedDate || t.dueDate)
                .sort((a, b) => {
                    const da = a.completedDate || a.dueDate;
                    const db = b.completedDate || b.dueDate;
                    return db.localeCompare(da);
                })
                .slice(0, 8);

            container.innerHTML = `
            <div class="dash-grid">
                <!-- 总览卡片 -->
                <div class="dash-card full-width">
                    <div class="dash-card-title">📊 任务总览</div>
                    <div class="dash-stat-row">
                        <div class="dash-stat-item">
                            <div class="dash-stat-num" style="color:var(--accent)">${total}</div>
                            <div class="dash-stat-label">任务总数</div>
                        </div>
                        <div class="dash-stat-item">
                            <div class="dash-stat-num" style="color:var(--success)">${doneCount}</div>
                            <div class="dash-stat-label">已完成</div>
                        </div>
                        <div class="dash-stat-item">
                            <div class="dash-stat-num" style="color:var(--warning)">${ipCount}</div>
                            <div class="dash-stat-label">进行中</div>
                        </div>
                        <div class="dash-stat-item">
                            <div class="dash-stat-num" style="color:var(--text-muted)">${todoCount}</div>
                            <div class="dash-stat-label">待开始</div>
                        </div>
                        <div class="dash-stat-item">
                            <div class="dash-stat-num" style="color:var(--danger)">${blockedCount}</div>
                            <div class="dash-stat-label">阻塞</div>
                        </div>
                        <div class="dash-stat-item">
                            <div class="dash-stat-num" style="color:#3b82f6">${todayDone}</div>
                            <div class="dash-stat-label">今日完成</div>
                        </div>
                    </div>
                </div>

                <!-- 分类分布 -->
                <div class="dash-card">
                    <div class="dash-card-title">📁 分类分布</div>
                    <div class="dash-bar-chart">
                        ${categories.map((cat, i) => `
                        <div class="dash-bar-row">
                            <span class="dash-bar-label">${cat}</span>
                            <div class="dash-bar-track">
                                <div class="dash-bar-fill ${catColors[i]}" style="width:${Math.max(catCounts[i] / maxCat * 100, catCounts[i] > 0 ? 8 : 0)}%">${catCounts[i]}</div>
                            </div>
                        </div>`).join('')}
                    </div>
                </div>

                <!-- 优先级分布 -->
                <div class="dash-card">
                    <div class="dash-card-title">🎯 优先级分布</div>
                    <div class="dash-priority-pie">
                        <div class="dash-pie-item"><span class="dash-pie-dot" style="background:var(--danger)"></span> 高优先级 ${highCount} (${total > 0 ? Math.round(highCount/total*100) : 0}%)</div>
                        <div class="dash-pie-item"><span class="dash-pie-dot" style="background:var(--warning)"></span> 中优先级 ${medCount} (${total > 0 ? Math.round(medCount/total*100) : 0}%)</div>
                        <div class="dash-pie-item"><span class="dash-pie-dot" style="background:var(--accent)"></span> 低优先级 ${lowCount} (${total > 0 ? Math.round(lowCount/total*100) : 0}%)</div>
                    </div>
                    <div class="dash-bar-chart" style="margin-top:16px">
                        <div class="dash-bar-row">
                            <span class="dash-bar-label">高</span>
                            <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${total > 0 ? highCount/total*100 : 0}%;background:var(--danger)">${highCount}</div></div>
                        </div>
                        <div class="dash-bar-row">
                            <span class="dash-bar-label">中</span>
                            <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${total > 0 ? medCount/total*100 : 0}%;background:var(--warning)">${medCount}</div></div>
                        </div>
                        <div class="dash-bar-row">
                            <span class="dash-bar-label">低</span>
                            <div class="dash-bar-track"><div class="dash-bar-fill" style="width:${total > 0 ? lowCount/total*100 : 0}%;background:var(--accent)">${lowCount}</div></div>
                        </div>
                    </div>
                </div>

                <!-- 最近动态 -->
                <div class="dash-card full-width">
                    <div class="dash-card-title">🕐 最近动态</div>
                    <div class="dash-timeline">
                        ${recentTasks.length === 0 ? '<div class="gantt-empty">暂无任务动态</div>' :
                        recentTasks.map(t => {
                            const dotClass = t.status === 'done' ? 'done' : t.status === 'in-progress' ? 'progress' : 'todo';
                            const dateText = t.completedDate ? `完成于 ${t.completedDate}` : `截止 ${t.dueDate || '未设置'}`;
                            return `<div class="dash-timeline-item" style="cursor:pointer" onclick="openTaskDetail('${t.id}')">
                                <span class="dash-timeline-dot ${dotClass}"></span>
                                <div class="dash-timeline-content">
                                    <div class="dash-timeline-name">${t.name}</div>
                                    <div class="dash-timeline-date">${dateText} · ${t.category} · ${statusLabel(t.status)}</div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            </div>`;
        }

        // ==================== 甘特图 ====================

        let ganttInstance = null;

        function renderGantt() {
            const container = document.getElementById('ganttContainer');
            if (!container) return;

            // 过滤有截止日期的非归档任务
            const ganttTasks = tasks.filter(t => t.status !== 'archived' && t.dueDate);

            if (ganttTasks.length === 0) {
                container.innerHTML = '<div class="gantt-empty">暂无可显示的甘特图数据，请确保任务有截止日期</div>';
                return;
            }

            // 计算开始日期（截止日期往前推7天或更早）
            const today = new Date();
            const ganttData = ganttTasks.map(t => {
                const due = new Date(t.dueDate);
                // 开始日期：截止日期往前推14天，或取completedDate
                let start;
                if (t.completedDate) {
                    start = new Date(t.completedDate);
                    if (start > due) start = new Date(due);
                } else {
                    start = new Date(due);
                    start.setDate(start.getDate() - 14);
                }
                // 开始日期不能晚于截止日期
                if (start > due) start = new Date(due);

                const progress = t.status === 'done' ? 100 : t.status === 'in-progress' ? 50 : t.status === 'blocked' ? 20 : 0;
                const isOverdue = t.status !== 'done' && t.dueDate < today.toISOString().split('T')[0];

                return {
                    id: t.id,
                    name: t.name,
                    start: formatDate(start),
                    end: t.dueDate,
                    progress: progress,
                    dependencies: t.parentId || '',
                    custom_class: isOverdue ? 'gantt-overdue' : ''
                };
            });

            container.innerHTML = `
            <div class="gantt-container">
                <div class="gantt-toolbar">
                    <span class="gantt-toolbar-title">📊 项目甘特图（${ganttTasks.length} 个任务）</span>
                    <div class="gantt-toolbar-btns">
                        <button class="gantt-btn" onclick="ganttViewChange('day')">日</button>
                        <button class="gantt-btn active" onclick="ganttViewChange('week')">周</button>
                        <button class="gantt-btn" onclick="ganttViewChange('month')">月</button>
                    </div>
                </div>
                <div id="ganttChart"></div>
            </div>`;

            // 初始化 Frappe Gantt
            try {
                ganttInstance = new Gantt('#ganttChart', ganttData, {
                    view_mode: 'week',
                    date_format: 'YYYY-MM-DD',
                    custom_popup_html: function(task) {
                        const t = tasks.find(x => x.id === task.id);
                        if (!t) return '';
                        return `<div class="gantt-popup">
                            <strong>${t.name}</strong><br>
                            ${t.category} · ${statusLabel(t.status)}<br>
                            📅 ${task.start} → ${task.end}<br>
                            进度: ${task.progress}%
                        </div>`;
                    },
                    on_click: function(task) {
                        openTaskDetail(task.id);
                    }
                });
            } catch(e) {
                container.innerHTML = `<div class="gantt-empty">甘特图加载失败: ${e.message}<br>请刷新页面重试</div>`;
            }
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function ganttViewChange(mode) {
            if (!ganttInstance) return;
            ganttInstance.change_view_mode(mode);
            document.querySelectorAll('.gantt-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ==================== 初始化 ====================
        loadTasks();
        updateKPI();
        updateRisks();
        initGoal();
        renderTable();
        renderTodo();
        renderKanban();
        renderDashboard();
        renderGantt();
        bindFilters();
        bindTodoFilters();
    </script>
</body>
</html>
