<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机决定</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .back-link {
    display: inline-block;
    margin: 20px 0 0 20px;
    padding: 8px 20px;
    background: #fff;
    color: #1a1a1a;
    text-decoration: none;
    border: 2px solid #1a1a1a;
    border-radius: 18px 12px 22px 14px;
    box-shadow: 3px 3px 0 #1a1a1a;
    font-size: 16px;
    transition: all 0.2s;
  }
  .back-link:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 #1a1a1a;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
  }
  .page-title {
    font-size: 36px;
    margin: 20px 0 6px;
    text-shadow: 3px 3px 0 #1a1a1a;
  }
  .page-subtitle {
    font-size: 16px;
    color: #666;
    margin-bottom: 24px;
  }
  .wheel-wrapper {
    position: relative;
    display: inline-block;
    margin: 0 auto 20px;
  }
  .wheel-pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 30px solid #1a1a1a;
    z-index: 10;
    filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.3));
  }
  canvas {
    display: block;
    margin: 0 auto;
    cursor: pointer;
  }
  .spin-btn {
    display: inline-block;
    margin: 16px 0 30px;
    padding: 12px 40px;
    background: #1a1a1a;
    color: #fafafa;
    border: none;
    border-radius: 22px 18px 26px 20px;
    box-shadow: 4px 4px 0 #555;
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 22px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .spin-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #555;
  }
  .spin-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #555;
  }
  .spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: 4px 4px 0 #555;
  }
  .options-section {
    background: #fff;
    border: 2.5px solid #1a1a1a;
    border-radius: 25px 20px 30px 22px;
    box-shadow: 4px 4px 0 #1a1a1a;
    padding: 24px;
    margin-top: 20px;
    text-align: left;
  }
  .options-section h3 {
    font-size: 20px;
    margin-bottom: 14px;
    text-align: center;
  }
  .options-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .option-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: #fff;
    border: 2px solid #1a1a1a;
    border-radius: 14px 10px 16px 12px;
    font-size: 15px;
    box-shadow: 2px 2px 0 #1a1a1a;
  }
  .option-tag .del-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    background: #1a1a1a;
    color: #fafafa;
    border: none;
    border-radius: 50%;
    font-size: 12px;
    cursor: pointer;
    line-height: 1;
    font-family: sans-serif;
  }
  .option-tag .del-btn:hover {
    background: #444;
  }
  .add-row {
    display: flex;
    gap: 8px;
  }
  .add-row input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #1a1a1a;
    border-radius: 14px 10px 16px 12px;
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 16px;
    background: #fafafa;
    outline: none;
  }
  .add-row input:focus {
    box-shadow: 2px 2px 0 #1a1a1a;
  }
  .add-row button {
    padding: 10px 20px;
    background: #1a1a1a;
    color: #fafafa;
    border: none;
    border-radius: 14px 10px 16px 12px;
    box-shadow: 3px 3px 0 #555;
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .add-row button:hover {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 #555;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.active {
    display: flex;
  }
  .modal-box {
    background: #fff;
    border: 3px solid #1a1a1a;
    border-radius: 28px 22px 32px 26px;
    box-shadow: 6px 6px 0 #1a1a1a;
    padding: 36px 40px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    animation: modalPop 0.3s ease;
  }
  @keyframes modalPop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .modal-box h2 {
    font-size: 28px;
    margin-bottom: 8px;
  }
  .modal-box .result-text {
    font-size: 36px;
    margin: 16px 0;
    padding: 12px;
    border: 2px dashed #1a1a1a;
    border-radius: 18px 14px 20px 16px;
  }
  .modal-box .close-btn {
    margin-top: 16px;
    padding: 10px 32px;
    background: #1a1a1a;
    color: #fafafa;
    border: none;
    border-radius: 18px 14px 20px 16px;
    box-shadow: 3px 3px 0 #555;
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-box .close-btn:hover {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 #555;
  }
</style>
</head>
<body>

<a href="wheel.html" class="back-link">&#8592; 返回转盘大全</a>

<div class="container">
  <h1 class="page-title">&#127919; 随机决定</h1>
  <p class="page-subtitle">做不做？去不去？</p>

  <div class="wheel-wrapper">
    <div class="wheel-pointer"></div>
    <canvas id="wheelCanvas" width="400" height="400"></canvas>
  </div>

  <br>
  <button class="spin-btn" id="spinBtn" onclick="spinWheel()">开 始</button>

  <div class="options-section">
    <h3>&#9998; 自定义选项</h3>
    <div class="options-list" id="optionsList"></div>
    <div class="add-row">
      <input type="text" id="newOption" placeholder="输入新选项..." maxlength="10">
      <button onclick="addOption()">添加</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h2>&#127919; 命运的选择</h2>
    <div class="result-text" id="resultText"></div>
    <button class="close-btn" onclick="closeModal()">遵从命运</button>
  </div>
</div>

<script>
  let options = ['做！', '不做', '再想想', '问朋友', '明天再说', '必须做'];
  let currentAngle = 0;
  let isSpinning = false;

  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    const size = Math.min(Math.max(window.innerWidth - 60, 280), 400);
    canvas.width = size;
    canvas.height = size;
    drawWheel();
  }

  function drawWheel() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const r = Math.max(cx - 10, 10);
    const n = options.length;
    const arc = (2 * Math.PI) / n;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.beginPath();
    ctx.arc(cx, cy, r + 4, 0, 2 * Math.PI);
    ctx.fillStyle = '#1a1a1a';
    ctx.fill();

    for (let i = 0; i < n; i++) {
      const startAngle = currentAngle + i * arc;
      const endAngle = startAngle + arc;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, startAngle, endAngle);
      ctx.closePath();

      ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#eeeeee';
      ctx.fill();

      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(startAngle + arc / 2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#1a1a1a';
      const fontSize = Math.min(Math.max(r / (n > 8 ? 8 : 6), 12), 20);
      ctx.font = fontSize + 'px "ZCOOL KuaiLe", cursive';
      const textR = r * 0.62;
      ctx.fillText(options[i], textR, 0);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.2, 0, 2 * Math.PI);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#1a1a1a';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const centerFontSize = Math.max(r * 0.1, 12);
    ctx.font = 'bold ' + centerFontSize + 'px "ZCOOL KuaiLe", cursive';
    ctx.fillText('开始', cx, cy);
  }

  function spinWheel() {
    if (isSpinning || options.length < 2) return;
    isSpinning = true;
    document.getElementById('spinBtn').disabled = true;

    const spins = 5 + Math.random() * 3;
    const extraAngle = Math.random() * 2 * Math.PI;
    const totalAngle = spins * 2 * Math.PI + extraAngle;
    const duration = 4000;
    const startTime = performance.now();
    const startAngle = currentAngle;

    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      currentAngle = startAngle + totalAngle * eased;
      drawWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;
        showResult();
      }
    }
    requestAnimationFrame(animate);
  }

  function showResult() {
    const n = options.length;
    const arc = (2 * Math.PI) / n;
    let normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
    let pointerAngle = (normalizedAngle + Math.PI / 2) % (2 * Math.PI);
    let index = Math.floor(pointerAngle / arc) % n;
    document.getElementById('resultText').textContent = options[index];
    document.getElementById('modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  function renderOptions() {
    const list = document.getElementById('optionsList');
    list.innerHTML = '';
    options.forEach(function(opt, i) {
      const tag = document.createElement('span');
      tag.className = 'option-tag';
      tag.innerHTML = opt + ' <button class="del-btn" onclick="removeOption(' + i + ')">x</button>';
      list.appendChild(tag);
    });
    drawWheel();
  }

  function addOption() {
    const input = document.getElementById('newOption');
    const val = input.value.trim();
    if (val && options.length < 12) {
      options.push(val);
      input.value = '';
      renderOptions();
    }
  }

  function removeOption(index) {
    if (options.length > 2) {
      options.splice(index, 1);
      renderOptions();
    }
  }

  document.getElementById('newOption').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addOption();
  });

  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  renderOptions();
</script>
</body>
</html>
