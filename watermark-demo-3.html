<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水印方案3 - 背景纹理水印</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
            color: white;
            position: relative;
        }

        /* 背景纹理水印 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 80px,
                    rgba(255,255,255,0.03) 80px,
                    rgba(255,255,255,0.03) 81px
                ),
                repeating-linear-gradient(
                    -45deg,
                    transparent,
                    transparent 120px,
                    rgba(255,255,255,0.02) 120px,
                    rgba(255,255,255,0.02) 121px
                );
            pointer-events: none;
            z-index: 0;
        }

        /* 文字水印层 */
        .watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            opacity: 0.08;
        }
        .watermark-text {
            position: absolute;
            font-size: 16px;
            color: white;
            white-space: nowrap;
            transform: rotate(-30deg);
            font-weight: 500;
        }

        .content {
            position: relative;
            z-index: 2;
        }
        .mock-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 800px;
        }
        .mock-card h2 { margin-bottom: 12px; font-size: 20px; }
        .mock-card p { opacity: 0.9; line-height: 1.6; }
    </style>
</head>
<body>
    <!-- 背景文字水印层 -->
    <div class="watermark-layer" id="watermarkLayer"></div>

    <div class="content">
        <h1 style="margin-bottom: 30px; font-size: 28px;">📊 企业文化工作看板</h1>
        <div class="mock-card">
            <h2>🎯 本月目标</h2>
            <p>完成年度企业文化活动方案策划，推进员工关怀体系落地...</p>
        </div>
        <div class="mock-card">
            <h2>📋 任务概览</h2>
            <p>待开始 5 | 进行中 3 | 已完成 12</p>
        </div>
        <div class="mock-card">
            <h2>📈 数据洞察</h2>
            <p>文化活动模块健康度 85%，品牌传播模块需关注...</p>
        </div>
    </div>

    <script>
        // 动态生成满屏水印文字
        const layer = document.getElementById('watermarkLayer');
        const text = '戴雯晞  企业文化  ';
        const rows = 15;
        const cols = 8;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const span = document.createElement('span');
                span.className = 'watermark-text';
                span.textContent = text;
                span.style.left = (c * 180 + (r % 2) * 90) + 'px';
                span.style.top = (r * 100) + 'px';
                layer.appendChild(span);
            }
        }
    </script>
</body>
</html>
